name: CI (TypeScript)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a run to be triggered on demand. Useful because this project publishes
  # by mirroring a tree: when a sync produces an identical tree no commit is made,
  # so there is no push event to test against.
  workflow_dispatch:

jobs:
  build:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
